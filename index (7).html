ound:#0b1c34;border:1px solid #304869;padding:10px 14px;border-radius:12px}.bar{height:11px;background:#0d2038;border-radius:99px;overflow:hidden;margin:19px 0}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));width:0%;transition:width .35s}.answers{display:grid;gap:11px;margin:24px 0}.answer{text-align:left;width:100%;padding:18px;display:flex;gap:14px;align-items:center;border:1px solid #50678b;color:var(--white);border-radius:15px;background:#1c3558;font-weight:650;line-height:1.4}.key{display:inline-grid;place-items:center;flex:0 0 33px;height:33px;border-radius:9px;background:#30496d;color:var(--gold)}.answer.ok{border-color:var(--green);background:#18483f}.answer.bad{border-color:var(--red);background:#57303d}.feedback{border-left:4px solid var(--cyan);background:#0d2940;padding:16px 19px;border-radius:9px;margin:14px 0 24px}.feedback strong{display:block;margin-bottom:6px}.level{color:var(--gold);font-weight:800}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{background:#0d2440;border:1px solid #38587b;border-radius:14px;padding:17px}.big{font-size:2rem;font-weight:900;color:var(--gold)}.review{border-bottom:1px solid #405678;padding:17px 0}.review strong{color:var(--gold)}footer{margin-top:20px;color:var(--muted);font-size:.82rem;text-align:center}@media(max-width:540px){.grid{grid-template-columns:1fr}.panel{border-radius:17px}.stats{font-size:.87rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{body{background:white;color:black}.panel{box-shadow:none;color:black;background:white}.secondary,.primary{display:none}main{max-width:100%}}
</style></head><body><main><header><div class="logo">◆ EVENTOS CHALLENGE <span style="color:var(--cyan)">50</span></div><button class="secondary" id="sound" type="button" aria-label="Activar o desactivar sonido">🔇 Sonido</button></header><div id="app"></div><footer>Unidad 1 · Comercialización de Eventos · CFGS Gestión de Alojamientos Turísticos<br>Juego de repaso de práctica autónoma · Casos y cifras de ejemplo, no tarifas reales</footer></main><script>
const QUESTIONS=[{"section": "1.1", "type": "test", "q": "¿Qué combinación recoge los elementos esenciales de un evento?", "answer": 0, "options": ["Personas, objetivo, espacio, servicios y experiencia", "Localización, publicidad y precio exclusivamente", "Alojamiento, transporte y excursiones obligatorios", "Salón, restauración y pernoctación siempre"], "why": "Un evento reúne personas con un objetivo en un lugar y momento determinados y necesita coordinación de espacios, servicios y experiencia. No exige siempre alojamiento ni restauración."}, {"section": "1.1", "type": "test", "q": "¿Cuál de estos ejemplos corresponde al mercado MICE?", "answer": 2, "options": ["Una cena familiar de aniversario", "Una fiesta privada de cumpleaños", "Un congreso profesional de especialistas", "Una comunión con 40 invitados"], "why": "MICE agrupa reuniones, incentivos, congresos/conferencias y exposiciones de carácter profesional."}, {"section": "1.1", "type": "test", "q": "¿Qué significa la I de MICE?", "answer": 1, "options": ["Information", "Incentives", "International", "Innovation"], "why": "La I corresponde a Incentives: viajes y actividades de incentivo empresarial."}, {"section": "1.1", "type": "test", "q": "En el contexto profesional, ¿qué significa networking?", "answer": 3, "options": ["Alquiler de equipos audiovisuales", "Diseño del protocolo de una mesa", "Reserva y registro hotelero", "Creación de contactos y relaciones profesionales"], "why": "El networking busca establecer contactos entre participantes, por ejemplo durante pausas o actividades de un congreso."}, {"section": "1.1", "type": "vf", "q": "Un evento empresarial puede necesitar habitaciones, comidas y tecnología además de una sala.", "answer": 0, "options": ["Verdadero", "Falso"], "why": "Las necesidades de un evento profesional pueden combinar espacio, alojamiento, restauración, tecnología y relaciones profesionales."}, {"section": "1.1", "type": "vf", "q": "Todo evento organizado en un hotel exige necesariamente un servicio de restauración.", "answer": 1, "options": ["Verdadero", "Falso"], "why": "Existen reuniones, entrevistas, cursos o conferencias que únicamente requieren el alquiler del salón y sus medios técnicos."}, {"section": "1.2", "type": "test", "q": "¿Quién representa principalmente la demanda en el mercado de eventos?", "answer": 0, "options": ["Empresas, instituciones y asociaciones que necesitan eventos", "Únicamente los hoteles con salas", "Solo proveedores de sonido", "Los recintos sin clientes"], "why": "La demanda la forman quienes necesitan contratar u organizar eventos; la oferta aporta recintos y servicios."}, {"section": "1.2", "type": "test", "q": "¿Qué función caracteriza a un OPC?", "answer": 2, "options": ["Alquilar vehículos exclusivamente", "Diseñar rutas de ocio del destino únicamente", "Organizar profesionalmente congresos y reuniones", "Vender habitaciones individuales de vacaciones"], "why": "Un OPC gestiona la organización de reuniones y congresos, coordinando programa, inscripciones y proveedores."}, {"section": "1.2", "type": "test", "q": "¿Qué caracteriza a una DMC?", "answer": 1, "options": ["Inspeccionar legislación alimentaria", "Coordinar servicios y experiencias en el destino", "Aprobar subvenciones del evento", "Determinar impuestos municipales"], "why": "Una DMC es una empresa especializada en servicios receptivos y experiencias vinculadas al destino."}, {"section": "1.2", "type": "test", "q": "¿Quién es un travel manager?", "answer": 3, "options": ["Un animador de celebraciones", "Un jefe de cocina", "Un técnico de iluminación", "Un profesional que gestiona viajes corporativos"], "why": "El travel manager gestiona las necesidades de viaje de una empresa, que pueden relacionarse con sus reuniones y eventos."}, {"section": "1.2", "type": "vf", "q": "En la venta de eventos, quien contrata y quien asiste son siempre la misma persona.", "answer": 1, "options": ["Verdadero", "Falso"], "why": "La empresa o institución puede tomar la decisión de contratación, mientras que las personas asistentes son usuarias finales distintas."}, {"section": "1.2", "type": "caso", "q": "Una asociación médica prepara un congreso y necesita gestionar ponentes e inscripciones. ¿Qué intermediario encaja mejor?", "answer": 0, "options": ["OPC", "DMC dedicada a excursiones", "Agencia centrada en vacaciones individuales", "Proveedor exclusivo de transporte"], "why": "El OPC se especializa en coordinar congresos: programa, asistentes, ponentes y proveedores. Una DMC puede complementar con servicios de destino."}, {"section": "1.3", "type": "test", "q": "¿Qué opción contiene solo componentes habituales de la oferta de eventos de un hotel?", "answer": 1, "options": ["Solo souvenirs y actividades externas", "Salones, alojamiento, restauración y tecnología", "Solo habitaciones y aparcamiento", "Únicamente una tarifa por persona"], "why": "Un hotel puede integrar espacios, habitaciones, comida, audiovisuales, personal y experiencias."}, {"section": "1.3", "type": "test", "q": "¿Qué servicio del hotel facilita especialmente una presentación híbrida?", "answer": 2, "options": ["Servicio de lavandería de huéspedes", "Minibar de las habitaciones", "Conectividad, audiovisuales y streaming", "Ampliación de la carta de almohadas"], "why": "La tecnología audiovisual y de streaming permite integrar a participantes presenciales y remotos."}, {"section": "1.3", "type": "test", "q": "¿Cuál es un ejemplo de venta cruzada asociada a un congreso hotelero?", "answer": 0, "options": ["Ofrecer habitaciones y cena a quienes contratan el salón", "Reducir la capacidad de la sala sin avisar", "Cobrar dos veces por el mismo equipamiento", "Eliminar el servicio de recepción"], "why": "La venta cruzada consiste en proponer servicios complementarios a la contratación principal, adecuados a las necesidades."}, {"section": "1.3", "type": "test", "q": "¿Qué complemento puede formar parte de una oferta hotelera de eventos?", "answer": 0, "options": ["Programa social y experiencias de destino", "Solo servicios de limpieza de habitaciones", "Únicamente administración de nóminas", "Exclusivamente almacenaje interno"], "why": "Además del salón y servicios básicos, pueden incorporarse actividades y experiencias relacionadas con el destino."}, {"section": "1.4", "type": "test", "q": "¿Cuál es el criterio principal para añadir un servicio complementario?", "answer": 1, "options": ["Que aparezca en todos los presupuestos", "Que responda a una necesidad identificada", "Que sea el servicio más caro", "Que sustituya la coordinación"], "why": "Los servicios deben seleccionarse en función del objetivo y de las necesidades reales del cliente."}, {"section": "1.4", "type": "test", "q": "¿Qué debe comprobarse al elegir una sala para una conferencia?", "answer": 2, "options": ["Solo su nombre comercial", "Solo si tiene vistas al mar", "Capacidad, montaje y equipamiento", "Solo su proximidad al restaurante"], "why": "La capacidad, la distribución de asistentes y los medios técnicos determinan si la sala sirve para el evento."}, {"section": "1.4", "type": "test", "q": "¿Qué servicio se relaciona directamente con la llegada y orientación de participantes?", "answer": 0, "options": ["Recepción e información", "Lavandería de uniformes", "Revenue management de habitaciones", "Mantenimiento del spa"], "why": "La recepción informa, acredita y dirige a los asistentes, facilitando el desarrollo del evento."}, {"section": "1.4", "type": "vf", "q": "La seguridad en un evento puede comprender personas, instalaciones y datos.", "answer": 0, "options": ["Verdadero", "Falso"], "why": "La planificación de servicios incluye medidas de seguridad de los participantes, del espacio y de la información utilizada."}, {"section": "1.4", "type": "caso", "q": "Un hotel recibe a 80 participantes en un curso que necesitan ver presentaciones y escuchar al ponente. ¿Qué paquete es más coherente?", "answer": 2, "options": ["Solo habitación y desayuno", "Excursión y cena de gala sin sala", "Sala adecuada, proyector, sonido y apoyo técnico", "Fotografía familiar y pista de baile"], "why": "La propuesta debe ajustarse a un curso: espacio, visibilidad, sonido y personal de apoyo técnico."}, {"section": "1.5", "type": "test", "q": "¿Qué criterio corresponde a una segmentación geográfica?", "answer": 2, "options": ["Edad del participante", "Motivación de asistencia", "Procedencia y desplazamiento de asistentes", "Presupuesto para restauración"], "why": "La variable geográfica distingue procedencia y necesidades de movilidad."}, {"section": "1.5", "type": "test", "q": "¿Cuál es una variable de comportamiento?", "answer": 1, "options": ["Ciudad de residencia", "Motivaciones y expectativas del cliente", "Número de plantas del hotel", "Superficie construida del salón"], "why": "La segmentación por comportamiento se centra en motivaciones, intereses y expectativas."}, {"section": "1.5", "type": "test", "q": "¿Qué información adicional resulta esencial al presupuestar un evento?", "answer": 0, "options": ["Número de asistentes, duración, presupuesto y decisor", "Solo el diseño del logotipo", "Solo el número de seguidores en redes", "Solo la antigüedad del hotel"], "why": "Estas variables permiten dimensionar el servicio y ajustar la propuesta a quien toma la decisión."}, {"section": "1.5", "type": "vf", "q": "Dos clientes que reúnen 15 directivos y 100 familiares requieren necesariamente la misma distribución de sala.", "answer": 1, "options": ["Verdadero", "Falso"], "why": "El tamaño, propósito y perfil del evento modifican montaje, horarios, restauración y comunicación."}, {"section": "1.5", "type": "caso", "q": "Un equipo comercial atiende a 15 directivos en una reunión confidencial. ¿Qué propuesta priorizarías?", "answer": 1, "options": ["Un cóctel para 150 personas y música en directo", "Sala privada con montaje apropiado y tecnología fiable", "Un salón sin conexión ni control de accesos", "Un programa infantil durante toda la sesión"], "why": "Para un grupo directivo conviene priorizar privacidad, funcionalidad, soporte técnico y servicios proporcionados."}, {"section": "1.6", "type": "test", "q": "¿Qué diferencia describe correctamente coste y precio?", "answer": 2, "options": ["Son siempre idénticos", "El coste es lo que paga el cliente", "El coste refleja recursos empleados y el precio es la oferta al cliente", "El precio solo puede calcularse después del evento"], "why": "El coste corresponde al consumo de recursos; el precio es el importe ofrecido o cobrado al cliente."}, {"section": "1.6", "type": "test", "q": "¿Cuál puede ser una fuente de financiación de un congreso?", "answer": 3, "options": ["Solo alquiler de habitaciones", "Solo beneficios del restaurante", "Solo pago a proveedores", "Inscripciones, patrocinadores, expositores o subvenciones"], "why": "El tema incluye cuotas de inscripción, aportaciones de patrocinadores, stands y posibles subvenciones."}, {"section": "1.6", "type": "vf", "q": "La aportación de un patrocinador puede ofrecerse a cambio de visibilidad durante un evento.", "answer": 0, "options": ["Verdadero", "Falso"], "why": "El patrocinio puede financiar parte de la actividad a cambio de presencia o difusión de la marca."}, {"section": "1.6", "type": "vf", "q": "La diferencia entre precio y costes directos equivale siempre al beneficio neto definitivo.", "answer": 1, "options": ["Verdadero", "Falso"], "why": "Todavía pueden existir otros gastos, impuestos y obligaciones que afecten al resultado final."}, {"section": "1.6", "type": "calculo", "q": "Caso hipotético: salón 300 €, coffee break 600 €, técnica 200 € y personal 150 €. ¿Cuál es el coste total?", "answer": 1, "options": ["1.150 €", "1.250 €", "1.350 €", "1.600 €"], "why": "Coste total = 300 + 600 + 200 + 150 = 1.250 €. El coste se obtiene sumando todas las partidas estimadas."}, {"section": "1.6", "type": "calculo", "q": "En el caso anterior el coste es 1.250 € y el precio ofertado es 1.600 €. ¿Cuál es la diferencia antes de otros gastos e impuestos?", "answer": 0, "options": ["350 €", "250 €", "450 €", "1.250 €"], "why": "Diferencia preliminar = 1.600 − 1.250 = 350 €. No es necesariamente el beneficio neto definitivo."}, {"section": "1.7", "type": "test", "q": "¿Qué tarea corresponde sobre todo a la fase anterior al evento?", "answer": 2, "options": ["Analizar satisfacción tras la clausura", "Entregar certificados al finalizar", "Difundir el programa y captar inscritos", "Recopilar valoraciones finales"], "why": "Antes del evento se informa, promociona y capta al público objetivo."}, {"section": "1.7", "type": "test", "q": "¿Cuál es el orden adecuado de las fases de venta comercial del tema?", "answer": 0, "options": ["Preparar, escuchar, argumentar, responder, cerrar y analizar", "Cerrar, argumentar, preparar, analizar, responder y escuchar", "Preparar, cerrar, escuchar, analizar, argumentar y responder", "Escuchar, cerrar, preparar, responder, argumentar y analizar"], "why": "La venta comienza con preparación y escucha; continúa con propuesta y objeciones y termina con cierre y análisis."}, {"section": "1.7", "type": "test", "q": "¿Para qué sirve un dossier comercial de eventos?", "answer": 3, "options": ["Sustituir los contratos legales", "Eliminar la visita al establecimiento", "Determinar automáticamente el ROI", "Mostrar espacios, capacidades, servicios y posibilidades de contratación"], "why": "El dossier ayuda a los clientes a valorar salones, aforos, recursos y servicios disponibles."}, {"section": "1.7", "type": "test", "q": "¿Qué caracteriza un fam trip comercial?", "answer": 1, "options": ["Una auditoría interna de costes", "Una visita de familiarización para profesionales invitados", "Una encuesta anónima posterior", "Una reunión para calcular el NPS"], "why": "El fam trip permite que agentes u organizadores conozcan de primera mano la oferta del establecimiento."}, {"section": "1.7", "type": "vf", "q": "La comunicación con el cliente termina cuando finaliza físicamente el evento.", "answer": 1, "options": ["Verdadero", "Falso"], "why": "Después del evento conviene agradecer, evaluar la satisfacción y mantener la relación comercial."}, {"section": "1.7", "type": "caso", "q": "El cliente dice: «Su presupuesto es demasiado caro». ¿Cuál es la respuesta comercial más adecuada?", "answer": 2, "options": ["Rebajar automáticamente todos los precios", "Ignorar la objeción y exigir el anticipo", "Aclarar las partidas, justificar el valor y estudiar alternativas", "Cancelar la reunión sin analizar sus necesidades"], "why": "La gestión de objeciones requiere escuchar, explicar el valor de la propuesta y explorar ajustes viables."}, {"section": "1.8", "type": "test", "q": "¿Cuál es un KPI útil para medir el interés inicial por un congreso?", "answer": 0, "options": ["Número de inscripciones registradas", "Color del mobiliario", "Antigüedad de la fachada", "Número de ascensores"], "why": "Las inscripciones permiten observar el interés y la captación antes del evento."}, {"section": "1.8", "type": "vf", "q": "Un evento puede evaluarse tanto por su resultado económico como por la satisfacción o los contactos generados.", "answer": 0, "options": ["Verdadero", "Falso"], "why": "Los indicadores dependen de los objetivos: rentabilidad, asistencia, notoriedad y relaciones comerciales."}, {"section": "1.8", "type": "calculo", "q": "Un congreso tiene 150 inscritos y 120 asistentes reales. ¿Qué porcentaje de inscritos asistió?", "answer": 1, "options": ["75 %", "80 %", "85 %", "90 %"], "why": "Tasa de asistencia = (120 / 150) × 100 = 80 %. Se compara el check-in real con las inscripciones."}, {"section": "1.8", "type": "calculo", "q": "Ejemplo hipotético: un salón de 150 m² genera 3.000 € de ingresos en el periodo. ¿Qué RevPAS por m² resulta?", "answer": 2, "options": ["15 €/m²", "18 €/m²", "20 €/m²", "25 €/m²"], "why": "RevPAS del ejemplo = 3.000 € / 150 m² = 20 €/m² en el periodo analizado. Se debe mantener el mismo periodo al comparar salones."}, {"section": "1.8", "type": "calculo", "q": "Una acción cuesta 5.000 € y genera un beneficio neto atribuible de 1.000 €. ¿Qué ROI simplificado obtiene?", "answer": 1, "options": ["10 %", "20 %", "25 %", "50 %"], "why": "ROI = (beneficio neto atribuible / inversión) × 100 = (1.000 / 5.000) × 100 = 20 %."}, {"section": "1.9", "type": "test", "q": "¿Qué información es apropiada para registrar en un CRM de eventos?", "answer": 2, "options": ["Datos irrelevantes de toda la familia", "Contraseñas privadas del cliente", "Contactos profesionales, propuestas y seguimiento comercial", "Datos indiscriminados sin finalidad"], "why": "El CRM ayuda a registrar contactos, presupuestos, incidencias y oportunidades relevantes, respetando la protección de datos."}, {"section": "1.9", "type": "vf", "q": "Disponer de los correos de los asistentes a un congreso permite enviarles cualquier publicidad sin más requisitos.", "answer": 1, "options": ["Verdadero", "Falso"], "why": "Para comunicaciones comerciales es necesario verificar la base jurídica aplicable y cumplir el deber de información; la inscripción no implica autorización automática."}, {"section": "1.9", "type": "caso", "q": "Un hotel organizó tres reuniones para una empresa y esta solicita otra. ¿Qué uso del CRM aporta más valor?", "answer": 1, "options": ["Borrar todos los datos comerciales de inmediato sin comprobar obligaciones", "Consultar servicios contratados y preferencias relevantes para preparar una propuesta", "Enviar la información de asistentes a terceros sin evaluación", "Repetir la propuesta anterior sin preguntar nuevas necesidades"], "why": "El CRM facilita personalización y continuidad, pero debe contrastarse la necesidad actual y respetar las finalidades de tratamiento."}, {"section": "1.10", "type": "test", "q": "¿Qué es un roadshow?", "answer": 3, "options": ["Un congreso celebrado siempre por streaming", "Una reunión exclusiva de directivos", "Una ceremonia de reconocimiento familiar", "Un evento o presentación que se realiza de forma itinerante"], "why": "El roadshow lleva un evento o presentación a distintos lugares para alcanzar públicos diferentes."}, {"section": "1.10", "type": "test", "q": "¿Qué define mejor un family day de empresa?", "answer": 0, "options": ["Una jornada que incorpora a las familias de empleados", "Una exposición exclusivamente comercial", "Un encuentro de proveedores internacionales", "Una reunión cerrada del comité directivo"], "why": "El family day integra actividades para empleados y sus familias como parte de la experiencia empresarial."}, {"section": "1.11", "type": "test", "q": "¿Qué acción se alinea con la sostenibilidad en eventos?", "answer": 2, "options": ["Imprimir material redundante para cada asistente", "Elegir recursos desechables sin estudiar alternativas", "Priorizar soportes digitales y reducir residuos", "Aumentar traslados innecesarios"], "why": "Las medidas de reducción de residuos y uso responsable de recursos contribuyen a una organización más sostenible."}, {"section": "1.11", "type": "test", "q": "¿Qué criterio es prioritario al colaborar con un creador de contenido para promocionar un evento?", "answer": 1, "options": ["Elegir a quien tenga más seguidores sin valorar audiencia", "Comprobar afinidad con el público y definir indicadores de resultados", "No medir el efecto de sus publicaciones", "Publicar mensajes sin identificar el objetivo"], "why": "La comunicación con influencers debe ser pertinente para la audiencia objetivo y evaluable mediante indicadores definidos."}];

try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved.name==='string'&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<=50&&Array.isArray(saved.answers)&&saved.answers.length===saved.index){state={...state,...saved,sound:false}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const el=document.getElementById('app'), esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function count(){return state.answers.filter((a,i)=>a===QUESTIONS[i].answer).length}
function level(n){return Math.min(4,Math.floor(Math.max(0,n)/10))}
function play(correct){if(!state.sound)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=correct?660:270;g.gain.setValueAtTime(.045,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.16);o.onended=()=>ctx.close()}catch(e){}}
function home(){el.innerHTML=`<section class="panel"><span class="pill">UNIDAD 1 · RETO DE REPASO</span><h1>¿Serías capaz de comercializar un evento con éxito?</h1><p class="sub">50 preguntas · 5 niveles · 500 puntos · Sin cronómetro · Explicaciones tras cada respuesta.</p><div class="grid"><div class="tile">🏨 <b>Casos hoteleros</b><p class="tiny">Situaciones aplicadas al sector turístico.</p></div><div class="tile">🏆 <b>Insignias y niveles</b><p class="tiny">Mejora a tu ritmo.</p></div></div><label for="student" style="display:block;margin-top:22px;font-weight:700">Tu nombre (solo se guarda en este dispositivo)</label><input id="student" maxlength="55" placeholder="Escribe tu nombre" value="${esc(state.name)}"><button id="start" class="primary">${state.index>0?'Continuar mi partida':'Comenzar el reto'} →</button><p class="tiny">Las respuestas no se envían al profesorado ni se guardan en ningún servidor.</p></section>`;document.getElementById('start').onclick=()=>{let n=document.getElementById('student').value.trim();if(!n){document.getElementById('student').focus();return;}state.name=n;save();render()}}
function render(){if(!state.name){home();return}if(state.index===50){finish();return}const i=state.index,q=QUESTIONS[i],l=level(i),score=count()*10;el.innerHTML=`<section class="panel"><div class="stats"><div class="stat">👤 ${esc(state.name)}</div><div class="stat">⭐ <b>${score}/500</b> puntos</div><div class="stat">Pregunta <b>${i+1}/50</b></div></div><div class="bar" role="progressbar" aria-label="Preguntas completadas" aria-valuenow="${i}" aria-valuemin="0" aria-valuemax="50"><div class="fill" style="width:${i*2}%"></div></div><p class="level">🏅 Nivel ${l+1}: ${LEVELS[l]}</p><span class="pill">${q.section} · ${SECTION_NAMES[q.section]} · ${q.type==='vf'?'Verdadero o falso':q.type==='calculo'?'Cálculo':q.type==='caso'?'Caso práctico':'Tipo test'}</span><h2>${esc(q.q)}</h2><div class="answers">${q.options.map((o,k)=>`<button class="answer" data-ans="${k}"><span class="key">${q.type==='vf'?(k?'F':'V'):String.fromCharCode(65+k)}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="response" aria-live="polite"></div></section>`;document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>select(+b.dataset.ans));}
function select(a){const i=state.index,q=QUESTIONS[i],correct=a===q.answer;document.querySelectorAll('[data-ans]').forEach(b=>{b.disabled=true;let k=+b.dataset.ans;if(k===q.answer)b.classList.add('ok');else if(k===a)b.classList.add('bad')});play(correct);document.getElementById('response').innerHTML=`<div class="feedback"><strong>${correct?'✅ ¡Respuesta correcta! +10 puntos':'💡 Sigue aprendiendo: esta vez no suma puntos'}</strong><p><b>Respuesta correcta:</b> ${esc(q.options[q.answer])}</p><p>${esc(q.why)}</p></div><button class="primary" id="next">${i===49?'Ver mis resultados':(i+1)%10===0?'Superar nivel →':'Siguiente pregunta →'}</button>`;document.getElementById('next').onclick=()=>{state.answers.push(a);state.index++;save();if(state.index%10===0&&state.index<50){milestone();}else render()};}
function milestone(){const l=level(state.index-1);el.innerHTML=`<section class="panel" style="text-align:center"><div style="font-size:4rem">🏅</div><p class="pill">INSIGNIA DESBLOQUEADA</p><h1>${LEVELS[l]}</h1><p>Has completado ${state.index} de 50 preguntas.</p><p class="big">${count()*10} puntos</p><button class="primary" id="continue">Continuar al siguiente nivel →</button></section>`;document.getElementById('continue').onclick=render}
function finish(){const hit=count(),pct=Math.round(hit*2),msg=pct>=90?'Experto en comercialización de eventos':pct>=70?'Muy buen dominio de los contenidos':pct>=50?'Buen progreso, pero conviene repasar':'Necesitas reforzar los conocimientos';const stats={};QUESTIONS.forEach((q,i)=>{let o=stats[q.section]??={ok:0,n:0};o.n++;if(state.answers[i]===q.answer)o.ok++});const weak=Object.entries(stats).filter(([s,o])=>o.ok/o.n<.7).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n);el.innerHTML=`<section class="panel"><p class="pill">RETO COMPLETADO</p><h1>¡Bien hecho, ${esc(state.name)}!</h1><p class="sub">${msg}</p><div class="grid"><div class="tile"><div class="big">${hit*10}/500</div>Puntos obtenidos</div><div class="tile"><div class="big">${pct}%</div>Respuestas correctas</div><div class="tile"><div class="big">${hit}</div>Aciertos</div><div class="tile"><div class="big">${50-hit}</div>Errores</div></div><h2>🏅 Nivel alcanzado: ${LEVELS[4]}</h2><h2>Revisión por apartados</h2><div class="grid">${Object.entries(stats).map(([s,o])=>`<div class="tile"><b>${s} · ${SECTION_NAMES[s]}</b><div class="tiny">${o.ok} de ${o.n} aciertos</div></div>`).join('')}</div><h2>¿Qué conviene repasar?</h2>${weak.length?`<p>${weak.map(([s])=>`${s} (${SECTION_NAMES[s]})`).join(' · ')}</p>`:'<p>Has conseguido al menos un 70 % de aciertos en todos los apartados.</p>'}<div class="buttons"><button class="secondary" id="review">Revisar mis errores</button><button class="primary" id="again">Volver a jugar</button></div></section>`;document.getElementById('review').onclick=review;document.getElementById('again').onclick=restart;}
function review(){let err=QUESTIONS.map((q,i)=>({...q,i,selected:state.answers[i]})).filter(q=>q.selected!==q.answer);el.innerHTML=`<section class="panel"><span class="pill">REPASO PERSONALIZADO</span><h1>Revisa tus ${err.length} errores</h1>${err.length?err.map(q=>`<div class="review"><span class="tiny">Pregunta ${q.i+1} · ${q.section}</span><p><b>${esc(q.q)}</b></p><p>Tu respuesta: ${esc(q.options[q.selected])}</p><p><strong>Correcta: ${esc(q.options[q.answer])}</strong></p><p class="sub">${esc(q.why)}</p></div>`).join(''):'<p>¡Sin errores! Has acertado todas las preguntas.</p>'}<div class="buttons"><button class="secondary" id="back">Volver a resultados</button><button class="primary" id="again">Repetir el reto</button></div></section>`;document.getElementById('back').onclick=finish;document.getElementById('again').onclick=restart;}
function restart(){const name=state.name,sound=state.sound;state={name,index:0,answers:[],sound};save();render()}
document.getElementById('sound').onclick=()=>{state.sound=!state.sound;document.getElementById('sound').textContent=state.sound?'🔊 Sonido':'🔇 Sonido';save()};render();
</script></body></html>
